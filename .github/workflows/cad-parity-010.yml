name: cad-parity-010

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "apps/web/**"
      - "apps/electron/**"
      - ".github/workflows/cad-parity-010.yml"
  pull_request:
    paths:
      - "app/**"
      - "apps/web/**"
      - "apps/electron/**"
      - ".github/workflows/cad-parity-010.yml"

# CAD-PARITY-010: solids, surfaces, meshes, booleans, exact sections,
# topology-aware selection & large-model performance (Issue #93, CAD/BIM
# Product Architecture v1.0 FROZEN under ConstructionOS Architecture v1.1).
# The three-job pattern (workspace-shell + web-host + electron-host):
#   - the FULL app suite now covers the boolean triad (union/difference/
#     intersection through the adapter boundary with the typed
#     boolean_empty/boolean_invalid declines), the EXACT adapter-backed
#     sections (canonical loops + hash), the deterministic topology maps
#     (canonical f/e/v ids, engine keys provenance-only) with the exactly-
#     ordered sub-entity picks, the bounded mesh entities + the LOD cache
#     (dual budgets, exact counters, revision-tied invalidation) — plus the
#     real-OCCT coverage incl. the CROSS-ENGINE canonical agreements
#     (identical canonical sections/topology between the reference and OCCT
#     engines for the same geometry)
#   - the web host runs the EIGHT parity smokes (the seven regression
#     fixtures byte-identical + the NEW pinned CAD-PARITY-010 fixture)
#   - the electron host runs SEVENTEEN smokes (the sixteen regression
#     smokes + the NEW model3d P010 real-UI smoke asserting the SAME pinned
#     010 fixture — Web/Electron parity is the acceptance criterion)
#
# CAD-PARITY-009: 3D navigation, UCS/workplanes & modeling (Issue #90,
# CAD/BIM Product Architecture v1.0 FROZEN under ConstructionOS Architecture
# v1.1). Proves the 3D navigation/modeling subsystem:
#   - workspace-shell: the FULL app suite with BOTH real engines installed
#     (cadquery-ocp / OCCT 7.8.1.1 for geometry; ifcopenshell 0.8.5 +
#     IfcTester 0.8.5 for IFC/openBIM) — the pre-existing regressions stay
#     green (919 tests) and the new deterministic CAD-PARITY-009 tests
#     run: the 3D core (the deterministic camera with orbit/pan/zoom/fit-
#     extents, the six standard views + isometric, the orthographic/
#     perspective projection with exact screen math and inverses, the
#     view-cube model), the UCS/workplane model (the orthonormality
#     validation with typed degenerate declines, the world↔UCS↔screen
#     transforms with exact inverses, the grid/snap projection onto the
#     active workplane), the deterministic 3D selection (the shared ray
#     math with exactly-ordered hit lists, the typed sub-entity declines)
#     and the section preview foundation (the bounded plane∩bbox preview
#     with the canonical hash, the typed exact-section decline), the
#     document model (ucs-/sp-NNNNNN monotonic minting, exact inverses
#     incl. key-adding updates, canonical-minimal snapshot/history, replay
#     integrity, legacy byte-identity, the active-UCS removal decline +
#     World immutability) and the App API/command surface (ucs.define/
#     update/remove/activate with the ucs_invalid/ucs_active typed
#     declines, view3d.set/fit/standard with the camera state persisted
#     as non-versioned editor settings, model3d.box/cylinder/extrude
#     placed through the ACTIVE UCS with the engine result (meshToken/
#     bbox/provenance) persisted in the SAME atomic revision, model3d.
#     transform move/rotate/scale with exact inverses, sectionplane.
#     create/update/remove, the ucs.list/view3d.state/model3d.pick/
#     model3d.sectionPreview/model3d.mesh queries with the typed
#     subentity_unsupported/section_exact_unsupported declines, save/open,
#     determinism). The LOCK-018 forbidden-import scan covers the extended
#     src/workspace core (incl. model3d/ + commands-model3d).
#   - web-host-workspace: the deployable Web host lints + typechecks +
#     builds, then serves the professional workspace from the running dev
#     server and drives the EXACT semantic command streams the UI produces
#     through /api/cad: the pinned CAD-PARITY-002 parity fixture (the
#     regression gate), the pinned CAD-PARITY-004 layers/styles fixture,
#     the pinned CAD-PARITY-005 annotation fixture, the pinned CAD-PARITY-
#     006 blocks fixture, the pinned CAD-PARITY-007 constraints fixture,
#     the pinned CAD-PARITY-008 layouts fixture AND the new pinned
#     CAD-PARITY-009 model3d fixture (the 3D workflow: UCS define/
#     activate with the world↔UCS transforms, the standard/fit camera
#     views with deterministic persistence, UCS-placed box/cylinder/
#     extrude solid creation with engine provenance, UCS-aware 3D move/
#     rotate/scale, the deterministic ordered-hit pick, the section-plane
#     preview, save/open).
#   - electron-host-workspace: the deployable Electron host builds and runs
#     SIXTEEN smokes — the nine regression smokes, the workspace
#     BrowserWindow smoke, the CAD-PARITY-004 layers real-UI smoke, the
#     CAD-PARITY-005 annotation real-UI smoke, the CAD-PARITY-006 blocks
#     real-UI smoke, the CAD-PARITY-007 constraints real-UI smoke, the
#     CAD-PARITY-008 layouts real-UI smoke AND the new CAD-PARITY-009
#     model3d real-UI smoke (the shared camera/projection 3D viewport,
#     the UCS/workplane switching, the solid creation + UCS-aware 3D
#     transforms, the deterministic ordered-hit 3D pick, the section
#     preview) asserting the SAME pinned 009 fixture sha AND the SAME
#     semantic command stream — Web/Electron parity is the acceptance
#     criterion (LOCK-004).
#
# Engine isolation (LOCK-003/018): no engine import leaks into the renderer,
# CADDocument, App API or the workspace command core (enforced by the
# LOCK-018 scan); IfcOpenShell/IfcTester run only inside the IFC adapter's
# disposable Python worker. The CAD-PARITY-009 core is engine-free by
# construction (pure TypeScript model3d modules — the deterministic
# camera/projection/UCS/section math, per the Issue #90 bounded scope: no
# advanced surface modeling, no subdivision meshes or point clouds, no
# full visual styles/rendering pipeline, no new OCCT worker operations —
# the slice composes the EXISTING box/cylinder/extrude/transform
# descriptor vocabulary).

jobs:
  workspace-shell:
    name: Workspace deterministic suite (OCCT 7.8.1.1 + ifcopenshell 0.8.5 toolchains)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python (pinned toolchain)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned OCCT engine (cadquery-ocp)
        run: pip install cadquery-ocp==7.8.1.1.post1

      - name: Install the pinned IFC toolchain (ifcopenshell + IfcTester)
        run: pip install ifcopenshell==0.8.5 IfcTester==0.8.5 numpy==2.1.3

      - name: Install root toolchain (tsx + typescript + ajv)
        run: npm install

      - name: Typecheck app shell (incl. the CAD-PARITY-009 model3d core)
        run: node_modules/.bin/tsc --noEmit -p app/tsconfig.json

      - name: "Full app test suite with both real engines (the pre-existing 987 + the new CAD-PARITY-010 boolean/section/topology/mesh-cache + real-OCCT tests)"
        working-directory: app
        run: node --import tsx --test test/*.test.ts

      - name: "CAD-PARITY-009/010 deterministic suite (the model3d core/document/commands + the 010 booleans/section-exact/topology/mesh-cache + the 003..008 kernels)"
        working-directory: app
        run: node --import tsx --test test/workspace-2d-*.test.ts test/model3d-*.test.ts

      - name: Forbidden-import static check (LOCK-018 incl. src/workspace + annotation/ + blocks/ + constraints/ + layouts/ + model3d/ + commands-parametrics + commands-layouts + commands-model3d)
        working-directory: app
        run: node --import tsx --test test/no-forbidden-imports.test.ts

      - name: IFC worker availability probe (pin check)
        working-directory: app
        run: |
          echo '{"op":"ping"}' | python3 src/adapters/ifc/worker/ifc-worker.py
          echo '{"op":"ping"}' | python3 src/adapters/ifc/worker/ifc-worker.py | grep -q '"engineVersion":"0.8.5"'

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-parity-010-shell-evidence
          path: app/src
          if-no-files-found: warn

  web-host-workspace:
    name: Web host (Next.js 16 + ALL EIGHT workspace smokes + ALL EIGHT parity fixtures)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Set up Python (pinned toolchain)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned engines (OCCT + ifcopenshell)
        run: pip install cadquery-ocp==7.8.1.1.post1 ifcopenshell==0.8.5 IfcTester==0.8.5 numpy==2.1.3

      - name: Install root toolchain (tsx for the shared-engine smoke)
        run: npm install

      - name: Install Web host deps
        working-directory: apps/web
        run: npm install

      - name: Web host lint (ESLint)
        working-directory: apps/web
        run: npm run lint

      - name: Web host typecheck (tsc --noEmit)
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Web host build (next build --webpack)
        working-directory: apps/web
        run: npm run build

      - name: Web host workspace workflow smokes (dev server + shared prompt engine + ALL EIGHT parity fixtures)
        working-directory: apps/web
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
          OFFISOS_IFC_WORKER: ${{ github.workspace }}/app/src/adapters/ifc/worker/ifc-worker.py
          OFFISOS_WEB_URL: http://localhost:3100
          # CAD-PARITY-009: the parity-fixture basis — the deterministic
          # reference adapter (the work item's engine-availability pattern;
          # real-OCCT coverage runs in the workspace-shell app tests).
          OFFISOS_GEOMETRY_ENGINE: reference
        run: |
          npm run dev -- --webpack -p 3100 &
          DEV_PID=$!
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null http://localhost:3100/ 2>/dev/null; then break; fi
            sleep 2
          done
          sleep 3
          cd ../..
          node --import tsx apps/web/test/workspace-smoke.mjs
          SMOKE_STATUS=$?
          if [ $SMOKE_STATUS -eq 0 ]; then
            node --import tsx apps/web/test/layers-styles-smoke.mjs
            SMOKE_STATUS=$?
          fi
          if [ $SMOKE_STATUS -eq 0 ]; then
            node --import tsx apps/web/test/annotation-smoke.mjs
            SMOKE_STATUS=$?
          fi
          if [ $SMOKE_STATUS -eq 0 ]; then
            node --import tsx apps/web/test/blocks-smoke.mjs
            SMOKE_STATUS=$?
          fi
          if [ $SMOKE_STATUS -eq 0 ]; then
            node --import tsx apps/web/test/constraints-smoke.mjs
            SMOKE_STATUS=$?
          fi
          if [ $SMOKE_STATUS -eq 0 ]; then
            node --import tsx apps/web/test/layouts-smoke.mjs
            SMOKE_STATUS=$?
          fi
          if [ $SMOKE_STATUS -eq 0 ]; then
            node --import tsx apps/web/test/model3d-smoke.mjs
            SMOKE_STATUS=$?
          fi
          if [ $SMOKE_STATUS -eq 0 ]; then
            node --import tsx apps/web/test/model3d-p010-smoke.mjs
            SMOKE_STATUS=$?
          fi
          kill $DEV_PID 2>/dev/null || true
          exit $SMOKE_STATUS

      - name: Upload workspace smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-parity-010-web-evidence
          path: |
            app/test/fixtures/cad-parity-002-parity.json
            app/test/fixtures/cad-parity-004-layers.json
            app/test/fixtures/cad-parity-006-annotation.json
            app/test/fixtures/cad-parity-009-model3d.json
            app/test/fixtures/cad-parity-010-model3d.json
          if-no-files-found: warn

  electron-host-workspace:
    name: Electron host (build + 17 smokes incl. the workspace + layers + annotation + blocks + constraints + layouts + model3d + model3d-P010 real-UI parity smokes)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/electron/package.json

      - name: Set up Python (pinned toolchain)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned engines (OCCT + ifcopenshell)
        run: pip install cadquery-ocp==7.8.1.1.post1 ifcopenshell==0.8.5 IfcTester==0.8.5 numpy==2.1.3

      - name: Install Xvfb (headless display)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Electron host deps
        working-directory: apps/electron
        run: npm install

      - name: Electron host typecheck
        working-directory: apps/electron
        run: npm run typecheck

      - name: Electron host build
        working-directory: apps/electron
        run: npm run build

      - name: Electron regression smokes (engine-free, geometry, model, impact, drafting, BIM, documentation, IFC, components)
        working-directory: apps/electron
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
          OFFISOS_IFC_WORKER: ${{ github.workspace }}/app/src/adapters/ifc/worker/ifc-worker.py
        run: |
          npm run smoke
          npm run smoke:geometry
          npm run smoke:model
          npm run smoke:impact
          npm run smoke:drafting
          npm run smoke:bim
          npm run smoke:docs
          npm run smoke:ifc
          npm run smoke:components

      - name: "Electron workspace smoke (real-UI parity: 19 steps incl. 5 CAD-PARITY-003 golden paths)"
        working-directory: apps/electron
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
          OFFISOS_IFC_WORKER: ${{ github.workspace }}/app/src/adapters/ifc/worker/ifc-worker.py
        run: npm run smoke:workspace

      - name: "Electron layers/styles/properties smoke (real-UI CAD-PARITY-004 golden paths + Web parity fixture)"
        working-directory: apps/electron
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
          OFFISOS_IFC_WORKER: ${{ github.workspace }}/app/src/adapters/ifc/worker/ifc-worker.py
        run: node test/smoke-layers.mjs

      - name: "Electron annotation smoke (real-UI CAD-PARITY-005 golden paths: canvas entity/entityPoint picks + the Web parity fixture + stream)"
        working-directory: apps/electron
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
          OFFISOS_IFC_WORKER: ${{ github.workspace }}/app/src/adapters/ifc/worker/ifc-worker.py
        run: node test/smoke-annotation.mjs

      - name: "Electron blocks smoke (real-UI CAD-PARITY-006 golden paths: canvas block source/instance picks + the Web parity fixture + stream)"
        working-directory: apps/electron
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
          OFFISOS_IFC_WORKER: ${{ github.workspace }}/app/src/adapters/ifc/worker/ifc-worker.py
        run: node test/smoke-blocks.mjs

      - name: "Electron constraints smoke (real-UI CAD-PARITY-007 golden paths: canvas entity/entityPoint constraint-target picks + the Web parity fixture + stream)"
        working-directory: apps/electron
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
          OFFISOS_IFC_WORKER: ${{ github.workspace }}/app/src/adapters/ifc/worker/ifc-worker.py
        run: node test/smoke-constraints.mjs

      - name: "Electron layouts smoke (real-UI CAD-PARITY-008 golden paths: layout tabs + the painted paper canvas + the plot preview overlay + deterministic artifact exports; the Web parity fixture + stream + artifact hashes)"
        working-directory: apps/electron
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
          OFFISOS_IFC_WORKER: ${{ github.workspace }}/app/src/adapters/ifc/worker/ifc-worker.py
        run: node test/smoke-layouts.mjs

      - name: "Electron model3d smoke (real-UI CAD-PARITY-009 golden paths: the shared camera/projection 3D viewport + UCS/workplane switching + solid creation/3D transforms + the deterministic ordered-hit pick + the section preview; the Web parity fixture + stream)"
        working-directory: apps/electron
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
          OFFISOS_IFC_WORKER: ${{ github.workspace }}/app/src/adapters/ifc/worker/ifc-worker.py
        run: node test/smoke-model3d.mjs

      - name: "Electron model3d P010 smoke (real-UI CAD-PARITY-010 golden paths: the boolean triad through the command line + the exact adapter-backed section + topology-aware sub-entity picking + the bounded mesh entity/LOD cache + the exact-section overlay; the Web parity fixture + stream)"
        working-directory: apps/electron
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
          OFFISOS_IFC_WORKER: ${{ github.workspace }}/app/src/adapters/ifc/worker/ifc-worker.py
        run: node test/smoke-model3d-p010.mjs

      - name: Upload workspace smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-parity-010-electron-evidence
          path: apps/electron/dist/smoke-workspace-result.json
          if-no-files-found: warn
