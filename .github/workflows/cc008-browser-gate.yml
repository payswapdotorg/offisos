name: cc008-browser-gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/browser-agent/cc008.mjs"
      - ".github/workflows/cc008-browser-gate.yml"
      - "docs/cad/browser-agent-phase-gate.md"
      - "governance/work-items/COMPAT-CAD-008.json"
      - "AI_CONTINUATION.md"

jobs:
  browser-agent:
    name: CC008 exact-SHA ephemeral deployment + browser agent
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 3854f5391fe58475b50bec9b33e695c33dabc467
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
      OFFISOS_TARGET_SHA: 3854f5391fe58475b50bec9b33e695c33dabc467
      OFFISOS_WEB_URL: http://127.0.0.1:3100
      OFFISOS_BROWSER_EVIDENCE: /tmp/cc008-browser-evidence.json
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out browser-agent harness from current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save browser-agent harness
        run: cp tools/browser-agent/cc008.mjs /tmp/cc008.mjs

      - name: Check out exact CC008 implementation revision
        run: git checkout --detach "$TARGET_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned engines
        run: pip install cadquery-ocp==7.8.1.1.post1 ifcopenshell==0.8.5 IfcTester==0.8.5 numpy==2.1.3

      - name: Install root dependencies
        run: npm install

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install

      - name: Install browser engine
        working-directory: apps/web
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start exact-SHA ephemeral deployment
        working-directory: apps/web
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
          OFFISOS_IFC_WORKER: ${{ github.workspace }}/app/src/adapters/ifc/worker/ifc-worker.py
          OFFISOS_WEB_URL: http://127.0.0.1:3100
        run: |
          nohup npm run dev -- --webpack -p 3100 >/tmp/offisos-cc008-server.log 2>&1 &
          echo $! >/tmp/offisos-server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/offisos-cc008-server.log
          exit 1

      - name: Run independent black-box CC008 browser agent
        working-directory: apps/web
        run: node /tmp/cc008.mjs

      - name: Validate evidence binding
        run: |
          test -s "$OFFISOS_BROWSER_EVIDENCE"
          node -e '
            const fs=require("fs");
            const e=JSON.parse(fs.readFileSync(process.env.OFFISOS_BROWSER_EVIDENCE,"utf8"));
            if(e.targetSha!==process.env.TARGET_SHA) process.exit(2);
            if(e.deployedRevision!==`ephemeral-ci:${process.env.GITHUB_RUN_ID}`) process.exit(3);
            if(e.pass!==true) process.exit(4);
          '

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc008-browser-gate-${{ github.run_id }}
          path: |
            /tmp/cc008-browser-evidence.json
            /tmp/cc008-*.png
            /tmp/offisos-cc008-server.log
          if-no-files-found: warn
