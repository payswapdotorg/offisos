name: cad-parity-005

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "apps/web/**"
      - "apps/electron/**"
      - ".github/workflows/cad-parity-005.yml"
  pull_request:
    paths:
      - "app/**"
      - "apps/web/**"
      - "apps/electron/**"
      - ".github/workflows/cad-parity-005.yml"

# CAD-PARITY-005: the annotation, text & dimension engine (Issue #82, CAD/
# BIM Product Architecture v1.0 FROZEN under ConstructionOS Architecture
# v1.1). Proves the annotation subsystem:
#   - workspace-shell: the FULL app suite with BOTH real engines installed
#     (cadquery-ocp / OCCT 7.8.1.1 for geometry; ifcopenshell 0.8.5 +
#     IfcTester 0.8.5 for IFC/openBIM) — the pre-existing CAD/drafting/BIM/
#     documentation/IFC/component/workspace regressions stay green (655
#     tests) and the 78 new deterministic CAD-PARITY-005 tests run: the
#     annotation entity vocabulary (strict typed constructors for the
#     8-type union, exact measurement math incl. rotated projections and
#     angular sector selection, legacy dim loading), the style-driven
#     render primitives (effective dim styles × style.scale × the document
#     annotation scale, live text-style font/width/oblique, arrow
#     flip-outside, text readability rotation, deterministic text metrics,
#     primitive-based picking), and the App API/command surface
#     (annotation.create with SERVER-side measurement + refs, the
#     associative remeasure cascade through entity.modify AND
#     drafting.delete in ONE atomic revision, typed disassociation,
#     annotation.update field rules, locked/frozen enforcement, save/open
#     round-trips, the 11-command prompt-engine flows incl. flag options
#     and multi-point collection). The LOCK-018 forbidden-import scan
#     covers the extended src/workspace core (geometry/, precision-2d,
#     entity-ops, commands-2d, commands-props, commands-anno, standards/,
#     annotation/).
#   - web-host-workspace: the deployable Web host lints + typechecks +
#     builds, then serves the professional workspace from the running dev
#     server and drives the EXACT semantic command streams the UI produces
#     through /api/cad: the pinned CAD-PARITY-002 parity fixture (the
#     regression gate), the pinned CAD-PARITY-004 layers/styles fixture
#     AND the new pinned CAD-PARITY-005 annotation fixture (36-command
#     stream: every annotation type, the flag/rotation options,
#     entity-picked dimensions, style-driven creation, DIMTEDIT, DIMSCALE,
#     the associative cascade, locked enforcement, save/open persistence).
#   - electron-host-workspace: the deployable Electron host builds and runs
#     TWELVE smokes — the nine regression smokes, the workspace
#     BrowserWindow smoke (the CAD-PARITY-002 14-step + CAD-PARITY-003
#     5-step real-UI parity workflow), the CAD-PARITY-004 layers real-UI
#     smoke AND the new CAD-PARITY-005 annotation real-UI smoke (canvas
#     ENTITY/entityPoint picks on the circle/legs/dimension through CDP)
#     asserting the SAME pinned 005 fixture sha AND the SAME 36-command
#     semantic stream — Web/Electron parity is the acceptance criterion
#     (LOCK-004).
#
# Engine isolation (LOCK-003/018): no engine import leaks into the renderer,
# CADDocument, App API or the workspace command core (enforced by the
# LOCK-018 scan); IfcOpenShell/IfcTester run only inside the IFC adapter's
# disposable Python worker. The CAD-PARITY-005 core is engine-free by
# construction (pure TypeScript annotation/measurement/render modules).

jobs:
  workspace-shell:
    name: Workspace deterministic suite (OCCT 7.8.1.1 + ifcopenshell 0.8.5 toolchains)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python (pinned toolchain)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned OCCT engine (cadquery-ocp)
        run: pip install cadquery-ocp==7.8.1.1.post1

      - name: Install the pinned IFC toolchain (ifcopenshell + IfcTester)
        run: pip install ifcopenshell==0.8.5 IfcTester==0.8.5 numpy==2.1.3

      - name: Install root toolchain (tsx + typescript + ajv)
        run: npm install

      - name: Typecheck app shell (incl. the CAD-PARITY-005 annotation core)
        run: node_modules/.bin/tsc --noEmit -p app/tsconfig.json

      - name: "Full app test suite with both real engines (733 tests: 655 pre-existing + 78 CAD-PARITY-005)"
        working-directory: app
        run: node --import tsx --test test/*.test.ts

      - name: "CAD-PARITY-005 deterministic suite (annotation entities/render/commands + the 003/004 kernels)"
        working-directory: app
        run: node --import tsx --test test/workspace-2d-*.test.ts

      - name: Forbidden-import static check (LOCK-018 incl. src/workspace + annotation/ + commands-anno)
        working-directory: app
        run: node --import tsx --test test/no-forbidden-imports.test.ts

      - name: IFC worker availability probe (pin check)
        working-directory: app
        run: |
          echo '{"op":"ping"}' | python3 src/adapters/ifc/worker/ifc-worker.py
          echo '{"op":"ping"}' | python3 src/adapters/ifc/worker/ifc-worker.py | grep -q '"engineVersion":"0.8.5"'

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-parity-005-shell-evidence
          path: app/src
          if-no-files-found: warn

  web-host-workspace:
    name: Web host (Next.js 16 + ALL THREE workspace smokes + ALL THREE parity fixtures)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Set up Python (pinned toolchain)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned engines (OCCT + ifcopenshell)
        run: pip install cadquery-ocp==7.8.1.1.post1 ifcopenshell==0.8.5 IfcTester==0.8.5 numpy==2.1.3

      - name: Install root toolchain (tsx for the shared-engine smoke)
        run: npm install

      - name: Install Web host deps
        working-directory: apps/web
        run: npm install

      - name: Web host lint (ESLint)
        working-directory: apps/web
        run: npm run lint

      - name: Web host typecheck (tsc --noEmit)
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Web host build (next build --webpack)
        working-directory: apps/web
        run: npm run build

      - name: Web host workspace workflow smokes (dev server + shared prompt engine + ALL THREE parity fixtures)
        working-directory: apps/web
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
          OFFISOS_IFC_WORKER: ${{ github.workspace }}/app/src/adapters/ifc/worker/ifc-worker.py
          OFFISOS_WEB_URL: http://localhost:3100
        run: |
          npm run dev -- --webpack -p 3100 &
          DEV_PID=$!
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null http://localhost:3100/ 2>/dev/null; then break; fi
            sleep 2
          done
          sleep 3
          cd ../..
          node --import tsx apps/web/test/workspace-smoke.mjs
          SMOKE_STATUS=$?
          if [ $SMOKE_STATUS -eq 0 ]; then
            node --import tsx apps/web/test/layers-styles-smoke.mjs
            SMOKE_STATUS=$?
          fi
          if [ $SMOKE_STATUS -eq 0 ]; then
            node --import tsx apps/web/test/annotation-smoke.mjs
            SMOKE_STATUS=$?
          fi
          kill $DEV_PID 2>/dev/null || true
          exit $SMOKE_STATUS

      - name: Upload workspace smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-parity-005-web-evidence
          path: |
            app/test/fixtures/cad-parity-002-parity.json
            app/test/fixtures/cad-parity-004-layers.json
            app/test/fixtures/cad-parity-005-annotation.json
          if-no-files-found: warn

  electron-host-workspace:
    name: Electron host (build + 12 smokes incl. the workspace + layers + annotation real-UI parity smokes)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/electron/package.json

      - name: Set up Python (pinned toolchain)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned engines (OCCT + ifcopenshell)
        run: pip install cadquery-ocp==7.8.1.1.post1 ifcopenshell==0.8.5 IfcTester==0.8.5 numpy==2.1.3

      - name: Install Xvfb (headless display)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Electron host deps
        working-directory: apps/electron
        run: npm install

      - name: Electron host typecheck
        working-directory: apps/electron
        run: npm run typecheck

      - name: Electron host build
        working-directory: apps/electron
        run: npm run build

      - name: Electron regression smokes (engine-free, geometry, model, impact, drafting, BIM, documentation, IFC, components)
        working-directory: apps/electron
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
          OFFISOS_IFC_WORKER: ${{ github.workspace }}/app/src/adapters/ifc/worker/ifc-worker.py
        run: |
          npm run smoke
          npm run smoke:geometry
          npm run smoke:model
          npm run smoke:impact
          npm run smoke:drafting
          npm run smoke:bim
          npm run smoke:docs
          npm run smoke:ifc
          npm run smoke:components

      - name: "Electron workspace smoke (real-UI parity: 19 steps incl. 5 CAD-PARITY-003 golden paths)"
        working-directory: apps/electron
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
          OFFISOS_IFC_WORKER: ${{ github.workspace }}/app/src/adapters/ifc/worker/ifc-worker.py
        run: npm run smoke:workspace

      - name: "Electron layers/styles/properties smoke (real-UI CAD-PARITY-004 golden paths + Web parity fixture)"
        working-directory: apps/electron
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
          OFFISOS_IFC_WORKER: ${{ github.workspace }}/app/src/adapters/ifc/worker/ifc-worker.py
        run: node test/smoke-layers.mjs

      - name: "Electron annotation smoke (real-UI CAD-PARITY-005 golden paths: canvas entity/entityPoint picks + the Web parity fixture + stream)"
        working-directory: apps/electron
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
          OFFISOS_IFC_WORKER: ${{ github.workspace }}/app/src/adapters/ifc/worker/ifc-worker.py
        run: node test/smoke-annotation.mjs

      - name: Upload workspace smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-parity-005-electron-evidence
          path: apps/electron/dist/smoke-workspace-result.json
          if-no-files-found: warn
