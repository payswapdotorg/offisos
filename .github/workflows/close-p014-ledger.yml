name: close-p014-ledger
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  close:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 109
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Close P014 ledger
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('governance/work-items/CAD-PARITY-014.json')
          d=json.loads(p.read_text())
          assert d['state']=='VERIFYING'
          assert not any(t.get('to')=='VERIFIED' for t in d['transitions'])
          d['transitions'].extend([
            {'from':'VERIFYING','to':'ARCHITECT_REVIEW','at':'2026-09-01T07:02:00Z','actor':'pectoraux','role':'architect','reason':'Final Architect review: exact final P014 head is CI green, exact-head Vercel deployment and real-browser evidence are revision-bound, protected-path and verified-revision gates pass, and the frozen Architecture v1.1 boundary is preserved.','references':{'issue':107,'pr':108,'commit':'4f59606d818098dc6c75309629f963a1d05cdca1','evidence':['EV-005']}},
            {'from':'ARCHITECT_REVIEW','to':'APPROVED','at':'2026-09-01T07:02:30Z','actor':'pectoraux','role':'architect','reason':'Architect approval: CAD-PARITY-014 satisfies Issue #107 acceptance criteria and all required deterministic, parity, deployment, browser, engine-boundary and governance gates; no blocking defect remains.','references':{'issue':107,'pr':108,'commit':'4f59606d818098dc6c75309629f963a1d05cdca1','evidence':['EV-001','EV-002','EV-003','EV-005']}},
            {'from':'APPROVED','to':'MERGED','at':'2026-09-01T07:04:55Z','actor':'pectoraux','role':'product-owner','reason':'PR #108 merged at the exact approved implementation head.','references':{'issue':107,'pr':108,'merge_commit':'3e72bfd1e82af60f1e0f9c692c24f3cadff96996'}},
            {'from':'MERGED','to':'VERIFIED','at':'2026-09-01T07:32:43Z','actor':'pectoraux','role':'architect','reason':'Post-merge P014 workflow on the actual mainline merge revision completed successfully; substantive interoperability and regression gates remain green and the final repository state is regression-safe.','references':{'issue':107,'pr':108,'commit':'3e72bfd1e82af60f1e0f9c692c24f3cadff96996','evidence':['EV-006']}}
          ])
          d['state']='VERIFIED'
          d['evidence'].append({'id':'EV-006','type':'automated-test-suite','description':'Post-merge verification on main revision 3e72bfd1e82af60f1e0f9c692c24f3cadff96996: dedicated cad-parity-014 push workflow run 33480443466 completed SUCCESS after executing the real OCCT/IFC workspace suite, Web host twelve-smoke suite and Electron regression suite; mainline regression workflows were also started on the same merge revision.','produced_at':'2026-09-01T07:32:43Z','reproducible':True,'reproduction':'Inspect push-triggered workflow run 33480443466 and require SUCCESS; inspect the mainline workflow set for merge revision 3e72bfd1e82af60f1e0f9c692c24f3cadff96996 and require SUCCESS for the relevant P014/regression workflows.','references':{'commit':'3e72bfd1e82af60f1e0f9c692c24f3cadff96996','pr':108,'workflow_run':'33480443466'}})
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          npm run governance -- validate
          npm test
          npm run governance -- check-protected --base origin/main
          npm run governance -- check-verified-revisions
      - name: Commit closure and remove workflow
        run: |
          git config user.name 'pectoraux'
          git config user.email 'ekontetevi@gmail.com'
          git rm .github/workflows/close-p014-ledger.yml
          git add governance/work-items/CAD-PARITY-014.json
          git commit -m 'chore(governance): close CAD-PARITY-014 ledger'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}