name: research-cad-004

on:
  push:
    branches: [main]
    paths:
      - "research/cad-004/**"
      - ".github/workflows/research-cad-004.yml"
  pull_request:
    paths:
      - "research/cad-004/**"
      - ".github/workflows/research-cad-004.yml"

jobs:
  benchmark:
    name: Model-to-quantity and Graph mapping benchmark (deterministic suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/cad-004
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/cad-004/requirements.txt

      - name: Install pinned toolchain versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Record exact installed versions
        run: |
          python -c "
          import ifcopenshell
          print('ifcopenshell', ifcopenshell.version)
          import importlib.metadata as md
          for d in ('cadquery-ocp', 'numpy'):
              print(d, md.version(d))
          "

      - name: Deterministic benchmark test suite (zero failures, zero unknowns)
        run: python -m pytest tests/ -q

      - name: Full benchmark evidence run
        run: python -m offisos_qtybench.benchmarks.run_all ci-run

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-cad-004-evidence
          path: research/cad-004/evidence/ci-run/
          if-no-files-found: error
