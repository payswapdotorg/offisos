name: close-p013-ledger
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  close:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Close P013 ledger
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('governance/work-items/CAD-PARITY-013.json')
          d=json.loads(p.read_text())
          assert d['state']=='VERIFYING'
          assert not any(x.get('to')=='VERIFIED' for x in d['transitions'])
          d['transitions'].extend([
            {'from':'VERIFYING','to':'ARCHITECT_REVIEW','at':'2026-08-31T22:07:15Z','actor':'pectoraux','role':'architect','reason':'Final Architect re-review after DEC-001 remediation: inherited P012 governance defect reconciled, repository governance green, exact-head P013 deployment/browser evidence revision-bound, P013/regression workflows green, Architecture v1.1 preserved.','references':{'issue':104,'pr':105,'commit':'347b2b946eb5d3791f28543b64db3c7be605caad','evidence':['EV-004']}},
            {'from':'ARCHITECT_REVIEW','to':'APPROVED','at':'2026-08-31T22:07:45Z','actor':'pectoraux','role':'architect','reason':'Architect approval: CAD-PARITY-013 satisfies Issue #104 acceptance criteria, frozen Architecture v1.1, regression requirements, exact-head Vercel/browser evidence, and governance controls; no blocking defect remains.','references':{'issue':104,'pr':105,'commit':'347b2b946eb5d3791f28543b64db3c7be605caad','evidence':['EV-001','EV-002','EV-003','EV-004'],'decision':'DEC-002'}},
            {'from':'APPROVED','to':'MERGED','at':'2026-08-31T22:08:03Z','actor':'pectoraux','role':'product-owner','reason':'PR #105 merged with the exact approved implementation head pinned by the Product Owner instruction to merge approved work.','references':{'issue':104,'pr':105,'merge_commit':'4aad64b08d41056d53335d3ef320015aac3789b7'}},
            {'from':'MERGED','to':'VERIFIED','at':'2026-08-31T22:14:00Z','actor':'pectoraux','role':'architect','reason':'Post-merge verification on actual mainline merge revision passed governance and substantive Web/Electron/CAD-BIM regression workflows; P013 remains revision-consistent and regression-safe.','references':{'issue':104,'pr':105,'commit':'4aad64b08d41056d53335d3ef320015aac3789b7','evidence':['EV-005'],'decision':'DEC-002'}}
          ])
          d['state']='VERIFIED'
          d['evidence'].append({'id':'EV-005','type':'automated-test-suite','description':'Post-merge verification on main revision 4aad64b08d41056d53335d3ef320015aac3789b7: governance validation run 33444771953 succeeded with 402 checks; post-merge cad-implement-001 run 33444773545 succeeded for Electron, Web and CAD/BIM application-shell checks; cad-parity-003 post-merge workflow run 33444773389 succeeded for the OCCT/IFC workspace, Web host and Electron host regression jobs.','produced_at':'2026-08-31T22:14:00Z','reproducible':True,'reproduction':'Inspect push-triggered mainline workflow runs for commit 4aad64b08d41056d53335d3ef320015aac3789b7 and require SUCCESS; governance validation and verified-revision audit must pass.','references':{'commit':'4aad64b08d41056d53335d3ef320015aac3789b7','pr':105,'workflow_run':'33444771953'}})
          d['decisions'].append({'id':'DEC-002','status':'approved','decided_at':'2026-08-31T22:07:45Z','decided_by':'pectoraux','role':'architect','rationale':'Final Architect approval after DEC-001 remediation: inherited P012 governance defects reconciled; repository governance green; exact-head deployment/browser evidence, regression evidence and protected-boundary checks satisfied.'})
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          npm run governance -- validate
          npm test
          npm run governance -- check-verified-revisions
          npm run governance -- check-protected --base origin/main
      - name: Commit closure and remove workflow
        run: |
          git config user.name 'pectoraux'
          git config user.email 'ekontetevi@gmail.com'
          git rm .github/workflows/close-p013-ledger.yml
          git add governance/work-items/CAD-PARITY-013.json
          git commit -m 'chore(governance): close CAD-PARITY-013 ledger'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
