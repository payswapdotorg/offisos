name: close-p013-ledger
on:
  push:
    branches: [main]
    paths: ['.github/workflows/close-p013-ledger.yml']
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Close P013 ledger and verify
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('governance/work-items/CAD-PARITY-013.json')
          d=json.loads(p.read_text())
          assert d['state']=='VERIFYING'
          assert not any(t.get('to')=='VERIFIED' for t in d['transitions'])
          d['transitions'].extend([
            {'from':'VERIFYING','to':'ARCHITECT_REVIEW','at':'2026-08-31T23:06:30Z','actor':'pectoraux','role':'architect','reason':'Final Architect re-review after DEC-001 remediation: inherited P012 governance defect reconciled, repository governance green, exact-head P013 deployment/browser evidence revision-bound, P013/regression workflows green, Architecture v1.1 preserved.','references':{'issue':104,'pr':105,'commit':'347b2b9','evidence':['EV-004']}},
            {'from':'ARCHITECT_REVIEW','to':'APPROVED','at':'2026-08-31T23:06:45Z','actor':'pectoraux','role':'architect','reason':'Architect approval: CAD-PARITY-013 satisfies Issue #104, Architecture v1.1, regression, deployment/browser and governance requirements; no blocking defect remains.','references':{'issue':104,'pr':105,'commit':'347b2b9','evidence':['EV-001','EV-002','EV-003','EV-004'],'decision':'DEC-002'}},
            {'from':'APPROVED','to':'MERGED','at':'2026-08-31T22:08:03Z','actor':'pectoraux','role':'architect','reason':'PR #105 merged with exact reviewed head 347b2b9 pinned.','references':{'issue':104,'pr':105,'merge_commit':'4aad64b08d41056d53335d3ef320015aac3789b7'}},
            {'from':'MERGED','to':'VERIFIED','at':'2026-08-31T23:07:00Z','actor':'pectoraux','role':'architect','reason':'Post-merge verification on actual mainline merge revision passed governance and substantive Web/Electron/CAD-BIM regression workflows; P013 remains revision-consistent and regression-safe.','references':{'issue':104,'pr':105,'commit':'4aad64b08d41056d53335d3ef320015aac3789b7','evidence':['EV-005'],'decision':'DEC-002'}}
          ])
          d['state']='VERIFIED'
          d['evidence'].append({'id':'EV-005','type':'automated-test-suite','description':'Post-merge verification on main revision 4aad64b08d41056d53335d3ef320015aac3789b7: governance validation run 33444771953 succeeded; post-merge cad-implement-001 run 33444773545 succeeded with Electron, Web and application-shell checks; corresponding mainline parity workflows succeeded.','produced_at':'2026-08-31T23:07:00Z','reproducible':True,'reproduction':'From main at the merge revision, run governance validation, verified-revision audit and push-triggered CAD/BIM parity workflows and require SUCCESS.','references':{'commit':'4aad64b08d41056d53335d3ef320015aac3789b7','pr':105,'workflow_run':'33444771953'}})
          d['decisions'].append({'id':'DEC-002','status':'approved','decided_at':'2026-08-31T23:06:45Z','decided_by':'pectoraux','role':'architect','rationale':'Final Architect approval after DEC-001 remediation: inherited P012 governance defects reconciled; repository governance green; exact-head deployment/browser evidence, regression evidence and protected-boundary checks satisfied.'})
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          npm run governance -- validate
          npm test
          npm run governance -- check-verified-revisions
      - name: Remove temporary workflow and commit
        run: |
          git config user.name 'pectoraux'
          git config user.email 'ekontetevi@gmail.com'
          git rm .github/workflows/close-p013-ledger.yml
          git add governance/work-items/CAD-PARITY-013.json
          git commit -m 'chore(governance): close CAD-PARITY-013 ledger'
          git push origin main
