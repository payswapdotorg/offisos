name: cad-implement-002

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "apps/web/**"
      - "apps/electron/**"
      - ".github/workflows/cad-implement-002.yml"
  pull_request:
    paths:
      - "app/**"
      - "apps/web/**"
      - "apps/electron/**"
      - ".github/workflows/cad-implement-002.yml"

# CAD-IMPLEMENT-002: real geometry engine adapter and model viewport
# (Issue #26, Architecture v1.1 FROZEN). Proves the REAL OCCT engine runs
# behind the frozen EngineAdapterBundle boundary on the pinned candidate
# toolchain:
#   - real-engine-shell: the full app test suite WITH the engine installed
#     (python3 + cadquery-ocp / OCCT 7.8.1.1) — the deterministic geometry
#     tests, worker-isolation tests, geometry.prepare command tests and the
#     Web/Electron host-parity test through the REAL adapter all RUN (never
#     skip); the existing 50-test suite stays green; the LOCK-018
#     forbidden-import static check stays green.
#   - web-host-real-engine: the deployable Web host lints + typechecks +
#     builds with the OCCT adapter wired, and serves geometry.prepare with a
#     deterministic occt: meshToken from the running dev server.
#   - electron-host-real-engine: the deployable Electron host builds and runs
#     BOTH smokes — the CAD-IMPLEMENT-001 engine-free smoke (regression) and
#     the CAD-IMPLEMENT-002 real-engine geometry smoke through a real
#     BrowserWindow (prepare -> applyEdit -> undo/redo -> typed failures).
#
# Engine isolation (LOCK-003/018): no job installs FreeCAD/IfcOpenShell; the
# OCCT kernel (via the OCP Python bindings — the same kernel FreeCAD builds
# on) runs ONLY inside the adapter's disposable subprocess workers
# (CAD-005 process-per-call isolation).

jobs:
  real-engine-shell:
    name: Real-engine deterministic suite (OCCT 7.8.1.1 toolchain)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python (pinned toolchain)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned OCCT engine (cadquery-ocp)
        run: pip install cadquery-ocp==7.8.1.1.post1

      - name: Install root toolchain (tsx + typescript + ajv)
        run: npm install

      - name: Typecheck app shell (incl. the OCCT adapter)
        run: node_modules/.bin/tsc --noEmit -p app/tsconfig.json

      - name: Full app test suite with the real engine (74 tests: 50 existing + 24 real-engine)
        working-directory: app
        run: node --import tsx --test test/*.test.ts

      - name: Forbidden-import static check (LOCK-018 engine/host coupling)
        working-directory: app
        run: node --import tsx --test test/no-forbidden-imports.test.ts

      - name: Engine availability probe (pin check)
        working-directory: app
        run: |
          echo '{"op":"ping"}' | python3 src/adapters/occt/worker/occt-worker.py
          echo '{"op":"ping"}' | python3 src/adapters/occt/worker/occt-worker.py | grep -q '"engineVersion":"7.8.1.1.post1"'

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-implement-002-shell-evidence
          path: app/src
          if-no-files-found: warn

  web-host-real-engine:
    name: Web host (Next.js 16 + real engine smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Set up Python (pinned toolchain)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned OCCT engine (cadquery-ocp)
        run: pip install cadquery-ocp==7.8.1.1.post1

      - name: Install Web host deps
        working-directory: apps/web
        run: npm install

      - name: Web host lint (ESLint)
        working-directory: apps/web
        run: npm run lint

      - name: Web host typecheck (tsc --noEmit)
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Web host build (next build --webpack)
        working-directory: apps/web
        run: npm run build

      - name: Web host real-engine smoke (geometry.prepare via the dev server)
        working-directory: apps/web
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
        run: |
          npm run dev -- --webpack -p 3000 &
          DEV_PID=$!
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null http://localhost:3000/ 2>/dev/null; then break; fi
            sleep 2
          done
          sleep 3
          echo "=== geometry.prepare through the Web host ==="
          RESPONSE=$(curl -sS -X POST http://localhost:3000/api/cad \
            -H "Content-Type: application/json" \
            -d '{"api":"1","body":{"type":"command","name":"geometry.prepare","payload":{"geometry":{"shape":"box","width":2,"depth":3,"height":4}}}}}')
          echo "$RESPONSE" | head -c 400; echo
          echo "$RESPONSE" | python3 -c "
import json, sys
d = json.load(sys.stdin)
assert d.get('ok') is True, f'geometry.prepare failed: {d}'
v = d['value']
assert v['meshToken'].startswith('occt:'), f'bad token: {v[\"meshToken\"]}'
assert v['mesh'] is not None and len(v['mesh']['vertices']) == 24, 'box mesh must have 8 verts'
assert abs(v['metadata']['volume'] - 24) < 1e-9, f'bad volume: {v[\"metadata\"][\"volume\"]}'
assert v['engine']['engineId'] == 'occt', f'bad engine: {v[\"engine\"]}'
print('WEB HOST REAL-ENGINE SMOKE PASS: token=' + v['meshToken'][:18] + '... volume=24 engine=' + v['engine']['engineId'] + '@' + v['engine']['engineVersion'])
"
          echo "=== typed failure smoke (malformed descriptor) ==="
          curl -sS -X POST http://localhost:3000/api/cad \
            -H "Content-Type: application/json" \
            -d '{"api":"1","body":{"type":"command","name":"geometry.prepare","payload":{"geometry":{"shape":"box","width":-1,"depth":1,"height":1}}}}' | \
            python3 -c "
import json, sys
d = json.load(sys.stdin)
assert d.get('ok') is False and d.get('code') == 'engine_malformed_input', f'expected typed failure: {d}'
print('TYPED FAILURE PASS: ' + d['code'])
"
          kill $DEV_PID || true

  electron-host-real-engine:
    name: Electron host (build + engine-free smoke + real-engine geometry smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/electron/package.json

      - name: Set up Python (pinned toolchain)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned OCCT engine (cadquery-ocp)
        run: pip install cadquery-ocp==7.8.1.1.post1

      - name: Install Electron runtime system libraries (xvfb + chromium deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2
          # libasound2 was renamed to libasound2t64 on ubuntu-24.04 (the 64-bit
          # time_t transition made it a virtual package with no installation
          # candidate). Install whichever concrete package the runner exposes so
          # the step works on both ubuntu-22.04 and ubuntu-24.04 runners.
          sudo apt-get install -y --no-install-recommends libasound2t64 || \
            sudo apt-get install -y --no-install-recommends libasound2

      - name: Install Electron host deps
        working-directory: apps/electron
        run: npm install

      - name: Electron host typecheck (tsc --noEmit)
        working-directory: apps/electron
        run: npm run typecheck

      - name: Electron host build (esbuild)
        working-directory: apps/electron
        run: npm run build

      - name: Engine-free regression smoke (CAD-IMPLEMENT-001, no geometry.prepare)
        working-directory: apps/electron
        run: npm run smoke

      - name: Real-engine geometry smoke (full chain through the BrowserWindow)
        working-directory: apps/electron
        env:
          OFFISOS_OCCT_WORKER: ${{ github.workspace }}/app/src/adapters/occt/worker/occt-worker.py
        run: npm run smoke:geometry

      - name: Upload Electron smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-implement-002-electron-smoke
          path: apps/electron/dist
          if-no-files-found: warn
