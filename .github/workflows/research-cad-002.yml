name: research-cad-002

on:
  push:
    branches: [main]
    paths:
      - "research/cad-002/**"
      - ".github/workflows/research-cad-002.yml"
  pull_request:
    paths:
      - "research/cad-002/**"
      - ".github/workflows/research-cad-002.yml"

env:
  FREECAD_VERSION: "1.1.3"
  FREECAD_SHA256: "3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef"
  FREECAD_URL: "https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage"

jobs:
  benchmark:
    name: FreeCAD/OCC 2D-3D CAD benchmark (deterministic suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/cad-002
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/cad-002/requirements.txt

      - name: Install pinned test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Cache FreeCAD AppImage (pinned version + SHA256)
        uses: actions/cache@v4
        with:
          path: research/cad-002/.freecad
          key: freecad-cad002-${{ env.FREECAD_VERSION }}-${{ env.FREECAD_SHA256 }}

      - name: Install FreeCAD (AppImage, no sudo required)
        run: |
          if [ ! -x ".freecad/squashfs-root/usr/bin/freecadcmd" ]; then
            mkdir -p .freecad
            curl -sL --retry 3 -o .freecad/freecad.AppImage "$FREECAD_URL"
            echo "$FREECAD_SHA256  .freecad/freecad.AppImage" | sha256sum -c -
            chmod +x .freecad/freecad.AppImage
            (cd .freecad && ./freecad.AppImage --appimage-extract > /dev/null && rm freecad.AppImage)
          fi
          .freecad/squashfs-root/usr/bin/freecadcmd --version

      - name: Deterministic benchmark test suite (zero failures, zero unknowns)
        env:
          FREECADCMD: ${{ github.workspace }}/research/cad-002/.freecad/squashfs-root/usr/bin/freecadcmd
        run: python -m pytest tests/ -q

      - name: Full benchmark evidence run
        env:
          FREECADCMD: ${{ github.workspace }}/research/cad-002/.freecad/squashfs-root/usr/bin/freecadcmd
        run: python -m offisos_cadbench2.benchmarks.run_all ci-run

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-cad-002-evidence
          path: research/cad-002/evidence/ci-run/
          if-no-files-found: error
