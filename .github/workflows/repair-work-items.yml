name: repair-work-items-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair dependencies and validate
        shell: python
        run: |
          from pathlib import Path
          import re
          from collections import defaultdict, deque

          p = Path('work-items.md')
          text = p.read_text(encoding='utf-8')

          block = '''### LICENSE-001 — Open-source composition and licensing gate

          Objective: Audit candidate upstream engines/libraries, their transitive licenses, trademarks and distribution/hosting constraints, and define approved composition boundaries.
          Requirements: PLAT-006, OFFICE-006, CAD-006, PM-006, EXT-005
          Dependencies: none
          Acceptance criteria: every proposed upstream dependency is classified; incompatible composition paths are rejected; approved alternatives and NOTICE/source-obligation requirements are recorded.
          Verification: license inventory + legal/architect review.
          Out of scope: product implementation.
          Evidence: dependency/license matrix and approval record.
          Definition of done: downstream compatibility work has an approved legal/composition boundary.

          '''
          block='\n'.join(x.strip() if x.strip() else '' for x in block.splitlines())+'\n'
          if '### LICENSE-001 — Open-source composition and licensing gate' not in text:
              text=text.replace('# Phase 0 — Repository/process foundation\n\n', '# Phase 0 — Repository/process foundation\n\n'+block, 1)

          text=text.replace('Dependencies: PLATFORM-005, AUTH-004','Dependencies: PLATFORM-005, PLATFORM-002')
          text=text.replace('Dependencies: RESEARCH-OFFICE-001, GRAPH-004','Dependencies: RESEARCH-OFFICE-001, GRAPH-001')
          text=text.replace('Dependencies: AI-002, AI-003, EVIDENCE-001','Dependencies: AI-002, AI-003, KNOW-001')
          p.write_text(text,encoding='utf-8')

          ids=re.findall(r'^###\s+([A-Z0-9-]+)\s+—',text,re.M)
          assert len(ids)==len(set(ids))
          idset=set(ids); graph=defaultdict(list); cur=None
          for line in text.splitlines():
              m=re.match(r'^###\s+([A-Z0-9-]+)\s+—',line)
              if m: cur=m.group(1)
              elif cur and line.startswith('Dependencies:'):
                  for d in re.findall(r'\b[A-Z]+(?:-[A-Z0-9]+)+\b',line.split(':',1)[1]):
                      assert d in idset, f'missing dependency {cur}->{d}'
                      graph[cur].append(d)
          indeg={n:0 for n in ids}; forward=defaultdict(list)
          for n,deps in graph.items():
              for d in deps: forward[d].append(n); indeg[n]+=1
          q=deque(n for n,v in indeg.items() if v==0); seen=[]
          while q:
              n=q.popleft(); seen.append(n)
              for nxt in forward[n]:
                  indeg[nxt]-=1
                  if indeg[nxt]==0:q.append(nxt)
          assert len(seen)==len(ids),'dependency cycle detected'

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work-items.md
          git diff --cached --quiet && exit 0
          git commit -m "fix(spec): repair work-item dependencies"
          git push
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/repair-work-items.yml
          git commit -m "chore: remove one-shot work-item repair workflow"
          git push
