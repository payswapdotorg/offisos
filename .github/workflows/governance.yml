name: governance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Governance validation (tests, records, protected paths)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history for diffing)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Deterministic governance test suite
        run: npm test

      - name: Validate work-item, ACR and reconciliation records against the canonical state machine
        run: npm run governance -- validate

      - name: Check protected architecture paths (pull requests)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # ARCH-WF-002: an implementation PR may only touch architecture-controlled
          # paths when it explicitly cites an APPROVED ACR covering them. The citation
          # channel is a single "ACR-Routing: ACR-003, ACR-004" line in the PR body.
          ACR_LINE=$(printf '%s\n' "$PR_BODY" | grep -iE '^[[:space:]]*ACR-Routing:' | tail -1 || true)
          ACR_ARGS=""
          if [ -n "$ACR_LINE" ]; then
            ACR_IDS=$(printf '%s' "$ACR_LINE" | sed -E 's/^[Aa][Cc][Rr]-[Rr][Oo][Uu][Tt][Ii][Nn][Gg]:[[:space:]]*//' | tr -d ' ')
            if [ -n "$ACR_IDS" ]; then
              ACR_ARGS="--acr ${ACR_IDS}"
              echo "Routing cited ACRs: ${ACR_IDS}"
            fi
          fi
          npm run governance -- check-protected --base origin/${{ github.base_ref }} ${ACR_ARGS}

      - name: Audit VERIFIED revision bindings (stale-verification drift check)
        run: npm run governance -- check-verified-revisions

      - name: Upload governance report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-report
          path: governance-report.json
          if-no-files-found: warn
