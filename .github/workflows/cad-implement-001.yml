name: cad-implement-001

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/cad-implement-001.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/cad-implement-001.yml"

# CAD-IMPLEMENT-001: shared CAD/BIM application shell (Web + Electron) per
# Architecture v1.1 LOCK-017/018/019. The renderer/editor core, hosts, App API,
# CADDocument model and adapter boundary are platform-independent. This
# workflow proves: Web/Electron parity, document serialization/versioning,
# transport independence, dummy-adapter operation, undo/redo, CI
# reproducibility, and no engine coupling (LOCK-018 static check).

jobs:
  shell:
    name: CAD/BIM application shell (deterministic suite)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root toolchain (tsx + typescript + ajv)
        run: npm install

      - name: Typecheck app shell
        run: node_modules/.bin/tsc --noEmit -p app/tsconfig.json

      - name: App shell deterministic test suite (42 tests)
        working-directory: app
        run: node --import tsx --test "test/*.test.ts"

      - name: Forbidden-import static check (LOCK-018 engine/host coupling)
        working-directory: app
        run: node --import tsx --test "test/no-forbidden-imports.test.ts"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-implement-001-evidence
          path: app/src
          if-no-files-found: warn
